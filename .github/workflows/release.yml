name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      candidate-tag:
        description: Version to validate against the selected revision
        required: true
        default: v0.1.0
      publish-testpypi:
        description: Publish the verified artifacts to TestPyPI (requires approval)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.10"
          python-version: "3.11"
      - name: Validate version and main ancestry
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.candidate-tag }}
        run: |
          python scripts/check_release.py "$RELEASE_TAG" --notes release-notes.md
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [validate, verify]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/dashpot
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: distributions
      - name: Verify artifact identity
        run: sha256sum -c SHA256SUMS
      - name: Publish with Trusted Publishing and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
          print-hash: true

  testpypi:
    needs: [validate, verify]
    if: github.event_name == 'workflow_dispatch' && inputs.publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/dashpot
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: distributions
      - name: Verify artifact identity
        run: sha256sum -c SHA256SUMS
      - name: Rehearse Trusted Publishing and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
          print-hash: true

  github-release:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: distributions
      - name: Create the GitHub Release from the published files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          sha256sum -c SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --title "Dashpot $RELEASE_TAG" --notes-file release-notes.md dist/*.whl dist/*.tar.gz SHA256SUMS build.json
