name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Rapid successive pushes or PR updates cancel superseded runs so only the
# newest cumulative commit completes. Future release/tag workflows must define
# their own concurrency policy without cancel-in-progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install locked environment
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run pytest -q

  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Build wheel and sdist
        run: uv build

      - uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: dist/
