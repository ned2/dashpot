name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Rapid successive pushes or PR updates cancel superseded runs so only the
# newest cumulative commit completes. Future release/tag workflows must define
# their own concurrency policy without cancel-in-progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) || github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.10"
          python-version: "3.11"

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install locked environment
        run: uv sync --locked --group dev

      - name: Cache pre-commit hook environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run the all-files quality gate
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python-version }}

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install locked environment
        run: uv sync --locked --group dev

      # One leg measures coverage so the report shows up in the log and job
      # summary; there is deliberately no threshold — the report finds gaps,
      # it does not gate (issue #81).
      - name: Run tests
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.11'
        run: uv run pytest -q

      - name: Run tests with a coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          uv run pytest -q --cov --cov-report=term-missing
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.10"
          python-version: "3.11"

      - name: Build and inspect the release artifacts
        run: |
          mkdir release-artifacts
          uv build --no-sources --out-dir release-artifacts/dist
          uv run --locked python scripts/check_distributions.py release-artifacts/dist > release-artifacts/SHA256SUMS
          uvx --from twine==7.0.0 twine check --strict release-artifacts/dist/*
          version=$(uv run --locked python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          uv run --locked python scripts/check_release.py "v$version" --main-ref HEAD --notes release-artifacts/release-notes.md
          python - <<'PYBUILD'
          import json, os, platform, subprocess
          from pathlib import Path
          report = {
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "ref": os.environ["GITHUB_REF"],
              "run": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              "python": platform.python_version(),
              "platform": platform.platform(),
              "uv": subprocess.check_output(["uv", "--version"], text=True).strip(),
          }
          Path("release-artifacts/build.json").write_text(json.dumps(report, indent=2) + "\n")
          PYBUILD

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: distributions
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  install:
    name: install (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: distributions
          path: release-artifacts
      - name: Verify and install the built distributions
        run: |
          cd release-artifacts
          shasum -a 256 -c SHA256SUMS
          cd ..
          python scripts/smoke_install.py release-artifacts/dist/*.whl release-artifacts/dist/*.tar.gz

  minimum-git:
    name: Git 2.39 compatibility (Debian 12)
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      # Install Git before checkout so it uses Git instead of its archive fallback.
      # Keep Bookworm's security updates even though the base image is pinned.
      - name: Install Debian Git and test prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends git ca-certificates procps zstd
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.10"
          python-version: "3.11"
      - name: Install locked environment
        run: uv sync --locked --group dev
      - name: Verify packaged Git 2.39
        run: |
          uv run python - <<'PYGIT'
          import re, shutil, subprocess
          executable = shutil.which("git")
          print(f"Git executable: {executable}", flush=True)
          assert executable == "/usr/bin/git", executable
          version = subprocess.check_output([executable, "--version"], text=True).strip()
          print(version, flush=True)
          assert re.fullmatch(r"git version 2\.39\.[0-9]+", version), version
          PYGIT
          dpkg-query --show --showformat='${Package} ${Version}\n' git
      - name: Test against Debian Git 2.39
        run: uv run pytest -q
