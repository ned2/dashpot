name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test-workers:
        description: Test processes (0 for serial benchmarks)
        type: choice
        options: ["0", "2", "4"]
        default: "2"
      benchmark:
        description: Compare serial and test-workers three times on representative runners
        type: boolean
        default: false
  workflow_call:
    inputs:
      full-verification:
        description: Mark reusable invocations (presence forces full verification)
        type: boolean
        default: true

permissions:
  contents: read

# The revision every job checks out and the quality job records: the branch
# head as pushed for a pull request run, github.sha otherwise. A pull request
# run does not require the branch to contain main (ADR 0045).
env:
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

# Rapid successive PR updates cancel superseded runs so only the
# newest cumulative commit completes. Future release/tag workflows must define
# their own concurrency policy without cancel-in-progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: select verification lane
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 0
      - name: Classify the complete PR diff
        id: classify
        env:
          FORCE_FULL: ${{ contains(toJSON(inputs), 'full-verification') }}
        run: python scripts/ci_lane.py classify

  quality:
    name: quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.10"
          python-version: "3.11"

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install locked environment
        run: uv sync --locked --group dev

      - name: Cache pre-commit hook environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Record the verified revision
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          python - <<'PYREVISION'
          import json, os
          from pathlib import Path
          record = {name: os.environ[name] for name in (
              "PR_HEAD_SHA", "PR_BASE_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"
          )}
          Path("ci-revision.json").write_text(json.dumps(record, indent=2) + "\n")
          PYREVISION

      - name: Run the all-files quality gate
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Publish the verified revision
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-revision-${{ github.run_attempt }}
          path: ci-revision.json
          if-no-files-found: error
          retention-days: 30

  test:
    needs: changes
    if: needs.changes.outputs.lane == 'full'
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    env:
      TEST_WORKERS: ${{ inputs.test-workers || '2' }}
      BENCHMARK: ${{ inputs.benchmark && ((matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14') || (matrix.os == 'macos-latest' && matrix.python-version == '3.11')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.benchmark && 45 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.PR_HEAD_SHA }}

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python-version }}

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install locked environment
        run: uv sync --locked --group dev

      # Python 3.14 uses coverage's lower-overhead sys.monitoring core.
      # The report finds gaps without a percentage threshold (issue #81);
      # tests and report generation must still pass.
      - name: Run tests
        if: env.BENCHMARK != 'true' && (matrix.os != 'ubuntu-latest' || matrix.python-version != '3.14')
        run: uv run pytest -q --durations=30 -n "$TEST_WORKERS" --dist=load --max-worker-restart=0

      - name: Run tests with a coverage report
        if: env.BENCHMARK != 'true' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        env:
          COVERAGE_DEBUG: sys,pid
          # pytest captures startup stderr on passing tests; preserve core evidence.
          COVERAGE_DEBUG_FILE: coverage-debug.log
        run: |
          uv run pytest -q --durations=30 -n "$TEST_WORKERS" --dist=load --max-worker-restart=0 --cov --cov-report=term-missing
          grep -E 'coverage_version:|core:' coverage-debug.log
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Benchmark serial and parallel tests
        if: env.BENCHMARK == 'true'
        env:
          BENCHMARK_COVERAGE: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          coverage_args=()
          if [ "$BENCHMARK_COVERAGE" = true ]; then coverage_args=(--coverage); fi
          workers=(0)
          if [ "$TEST_WORKERS" != 0 ]; then workers+=("$TEST_WORKERS"); fi
          uv run python scripts/benchmark_tests.py --output .review-coverage/benchmark --workers "${workers[@]}" "${coverage_args[@]}"
      - name: Upload benchmark evidence
        if: always() && env.BENCHMARK == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: benchmark-${{ matrix.os }}-${{ matrix.python-version }}
          path: .review-coverage/benchmark/
          if-no-files-found: error

  build:
    needs: changes
    if: needs.changes.outputs.lane == 'full'
    name: build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.10"
          python-version: "3.11"

      - name: Build and inspect the release artifacts
        run: |
          mkdir release-artifacts
          uv build --no-sources --out-dir release-artifacts/dist
          uv run --locked python scripts/check_distributions.py release-artifacts/dist > release-artifacts/SHA256SUMS
          uvx --from twine==7.0.0 twine check --strict release-artifacts/dist/*
          version=$(uv run --locked python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          uv run --locked python scripts/check_release.py "v$version" --main-ref HEAD --notes release-artifacts/release-notes.md
          python - <<'PYBUILD'
          import json, os, platform, subprocess
          from pathlib import Path
          report = {
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "ref": os.environ["GITHUB_REF"],
              "run": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              "python": platform.python_version(),
              "platform": platform.platform(),
              "uv": subprocess.check_output(["uv", "--version"], text=True).strip(),
          }
          Path("release-artifacts/build.json").write_text(json.dumps(report, indent=2) + "\n")
          PYBUILD

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: distributions
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  install:
    name: install (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: [changes, build]
    if: needs.changes.outputs.lane == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: distributions
          path: release-artifacts
      - name: Verify and install the built distributions
        run: |
          cd release-artifacts
          shasum -a 256 -c SHA256SUMS
          cd ..
          python scripts/smoke_install.py release-artifacts/dist/*.whl release-artifacts/dist/*.tar.gz

  minimum-git:
    needs: changes
    if: needs.changes.outputs.lane == 'full'
    name: Git 2.39 compatibility (Debian 12)
    env:
      TEST_WORKERS: ${{ inputs.test-workers || '2' }}
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171
    timeout-minutes: ${{ inputs.benchmark && 45 || 15 }}
    defaults:
      run:
        shell: bash
    steps:
      # Install Git before checkout so it uses Git instead of its archive fallback.
      # Keep Bookworm's security updates even though the base image is pinned.
      - name: Install Debian Git and test prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends git ca-certificates procps zstd
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          persist-credentials: false
      # The container user differs from the host owner of this bind mount;
      # checkout's temporary Git config does not persist into ordinary steps.
      - name: Trust and verify the mounted checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files --error-unmatch pyproject.toml
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.10"
          python-version: "3.11"
      - name: Install locked environment
        run: uv sync --locked --group dev
      - name: Verify packaged Git 2.39
        run: |
          uv run python - <<'PYGIT'
          import re, shutil, subprocess
          executable = shutil.which("git")
          print(f"Git executable: {executable}", flush=True)
          assert executable == "/usr/bin/git", executable
          version = subprocess.check_output([executable, "--version"], text=True).strip()
          print(version, flush=True)
          assert re.fullmatch(r"git version 2\.39\.[0-9]+", version), version
          PYGIT
          dpkg-query --show --showformat='${Package} ${Version}\n' git
      - name: Test against Debian Git 2.39
        if: ${{ !inputs.benchmark }}
        run: uv run pytest -q --durations=30 -n "$TEST_WORKERS" --dist=load --max-worker-restart=0

      - name: Benchmark serial and parallel tests against Debian Git
        if: inputs.benchmark
        run: |
          if [ "$TEST_WORKERS" = 0 ]; then
            uv run python scripts/benchmark_tests.py --output .review-coverage/benchmark --workers 0
          else
            uv run python scripts/benchmark_tests.py --output .review-coverage/benchmark --workers 0 "$TEST_WORKERS"
          fi
      - name: Upload benchmark evidence
        if: always() && inputs.benchmark
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: benchmark-debian-minimum-git
          path: .review-coverage/benchmark/
          if-no-files-found: error

  ci-required:
    name: CI required
    if: ${{ always() }}
    needs: [changes, quality, test, build, install, minimum-git]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.PR_HEAD_SHA }}
      - name: Require every job expected for the selected lane
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python scripts/ci_lane.py require
