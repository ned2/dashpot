[project]
name = "dashpot"
version = "0.1.0"
description = "Useful damping for agent-driven projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "textual==8.2.8",
]

[project.scripts]
dashpot = "dashpot.cli:main"
dashpot-codex-hook = "dashpot.hook:main"
dashpot-claude-code-hook = "dashpot.hook:claude_code_main"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "textual-dev",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashpot"]
