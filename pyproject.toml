[project]
name = "dashpot"
version = "0.1.0"
description = "Useful damping for agent-driven projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "textual==8.2.8",
]

[project.scripts]
dashpot = "dashpot.cli:main"
dashpot-codex-hook = "dashpot.hook:main"
dashpot-claude-code-hook = "dashpot.hook:claude_code_main"

[dependency-groups]
dev = [
  "pre-commit",
  "pytest",
  "pytest-asyncio",
  "ruff",
  "textual-dev",
  "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashpot"]

[tool.ruff]
# Everything Ruff sees is Python 3.11+ (from requires-python); the default
# 88-column layout applies to the package, tests, and conformance fixtures.
src = ["src", "tests"]

[tool.ruff.lint]
# An explicit, deliberately modest rule set: pyflakes/pycodestyle errors, import
# ordering, modernisation, bugbear, and the simplification/comprehension families
# that catch real mistakes without imposing stylistic churn.
select = [
  "E4", "E7", "E9", "F", "W", # pyflakes and pycodestyle errors
  "I",                        # isort
  "UP",                       # pyupgrade
  "B",                        # flake8-bugbear
  "C4",                       # flake8-comprehensions
  "SIM",                      # flake8-simplify
  "PIE",                      # flake8-pie
  "RUF",                      # Ruff-specific rules
]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses are immutable, so calling them in argument and dataclass
# defaults is safe (B008, RUF009).
extend-immutable-calls = [
  "dashpot.issue_list.IssueListQuery",
  "dashpot.issue_table.IssueTableViewState",
]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.11"
