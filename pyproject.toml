[project]
name = "dashpot"
version = "0.1.0"
description = "Useful damping for agent-driven projects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ned Letcher" }]
requires-python = ">=3.11"
keywords = ["tui", "textual", "github", "issues", "git", "worktree", "coding-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "cyclopts>=4.23.3,<5",
  "textual==8.2.8",
  "typing-extensions>=4.15.0",
]

[project.urls]
Homepage = "https://github.com/ned2/dashpot"
Repository = "https://github.com/ned2/dashpot"
Issues = "https://github.com/ned2/dashpot/issues"

[project.scripts]
dashpot = "dashpot.cli:main"
dashpot-codex-hook = "dashpot.hook:main"
dashpot-claude-code-hook = "dashpot.hook:claude_code_main"

[dependency-groups]
dev = [
  "pre-commit",
  "pytest",
  "pytest-asyncio",
  "ruff",
  "textual-dev",
  "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashpot"]

[tool.ruff]
# Everything Ruff sees is Python 3.11+ (from requires-python). `src` lets isort
# recognise the package and the tests' shared helper modules as first-party.
src = ["src", "tests"]

[tool.ruff.lint]
# An explicit rule set: pyflakes/pycodestyle errors, import ordering, bugbear,
# Ruff's own rules, full annotation coverage in the package, stub-style typing
# hygiene, no blanket `type: ignore`, plus the modernisation and simplification
# families that catch real mistakes without imposing stylistic churn.
select = [
  "E4", "E7", "E9", "F", # pyflakes and pycodestyle errors
  "I",                   # isort
  "B",                   # flake8-bugbear
  "RUF",                 # Ruff-specific rules
  "ANN",                 # flake8-annotations
  "PYI",                 # flake8-pyi
  "blanket-type-ignore", # PGH003
  "UP",                  # pyupgrade
  "SIM",                 # flake8-simplify
  "C4",                  # flake8-comprehensions
  "PIE",                 # flake8-pie
]
preview = true

[tool.ruff.lint.per-file-ignores]
# Test signatures stay lightweight; ty still checks their bodies.
"tests/**/*.py" = ["ANN"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses are immutable, so calling them in argument and dataclass
# defaults is safe (B008, RUF009).
extend-immutable-calls = [
  "dashpot.issue_list.IssueListQuery",
  "dashpot.issue_table.IssueTableViewState",
]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.analysis]
# Dashpot validates untyped JSON by `isinstance` narrowing; strict generic
# narrowing would turn every such check into a cast.
strict-generic-narrowing = false
strict-literal-narrowing = true

[tool.ty.rules]
blanket-ignore-comment = "error"
division-by-zero = "warn"
dynamic-function-decorator-return = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
unsupported-dynamic-base = "warn"

[tool.ty.src]
# The package, its tests, and the maintenance scripts are all checked; there
# are no blanket exclusions.
include = ["src", "tests", "scripts"]

[tool.ty.terminal]
error-on-warning = true
