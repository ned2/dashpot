# Shared quality gate. `uv run pre-commit install` enables both the fast commit
# hooks and the pre-push gate; `uv run pre-commit run --all-files` runs the commit
# hooks over every tracked file; `uv run pre-commit autoupdate --freeze` refreshes
# the pinned pre-commit-hooks revision, while Ruff and ty come from uv.lock
# (see README.md).
#
# Hook order matters: Ruff's lint fixes run before `ruff-format` so formatting
# has the last word on layout, and ty runs after both so it checks the code as
# it will be committed.
minimum_pre_commit_version: "4.6.1"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Two trailing spaces are an intentional Markdown hard line break.
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-added-large-files
      - id: detect-private-key
      - id: debug-statements
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # Ruff and ty run from the locked environment, so the commit hooks, CI's
  # quality job, the pre-push gate and `uv run` all use the versions uv.lock
  # pins; a remote hook repository would pin a second, drifting version.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      # ty checks the whole project: a change to one file, or its deletion,
      # can surface a diagnostic in another.
      - id: ty
        name: ty
        entry: uv run --locked ty check
        language: system
        types_or: [python, pyi, jupyter]
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: check-docs
        name: markdown links, document frontmatter, ADR numbering, the ADR index, and the code map
        entry: uv run --locked python scripts/maintain_docs.py
        language: system
        # Every check is cross-document: a link resolves against files the
        # commit may not touch, so the gate always reads the whole set.
        always_run: true
        pass_filenames: false

      - id: full-quality-gate
        name: pushed revision quality gate (tests run in CI)
        entry: uv run --locked python scripts/check_quality.py --skip-tests
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
